[project]
name = "driftguard"
version = "0.1.0"
description = "Identity drift detection for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Team Akshaya, VIT Pune"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
bench = ["scikit-learn>=1.3"]

[project.scripts]
driftguard = "driftguard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["driftguard"]
